seed_everything: true

trainer:
  accelerator: gpu
  strategy: ddp_find_unused_parameters_true
  devices: 1
  num_nodes: 1
  precision: 16-mixed
  max_epochs: 200
  check_val_every_n_epoch: 5
  num_sanity_val_steps: 0
  log_every_n_steps: 100
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: "/vq/pixelcnn_log/ffhq_256"  # set to your checkpoint directory
        save_top_k: 5
        monitor: "val/loss"
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
  logger:
    class_path: lightning.pytorch.loggers.TensorBoardLogger
    init_args:
      save_dir: "/vq/pixelcnn_log/ffhq_256"  # set to your logging directory
      version: "n16384"
      name:

model:
  class_path: taming.models.pixelcnn.PixelCNN
  init_args:
    first_stage_key: image
    cond_stage_key: class_label
    dim: 128
    n_layers: 15
    n_classes: 0
    learning_rate: 1e-4
    weight_decay: 1e-4
    first_stage_config:
      target: taming.models.vq.VQModel
      params:
        ckpt_path: "/vq/vq_log/ffhq_256/epoch=84-step=79730.ckpt"  # point to your trained tokenizer
        use_ema: true
        model_type: "full"
        stage: transformer
        ddconfig:
          double_z: False
          z_channels: 32
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult: [1, 1, 2, 2, 4]
          num_res_blocks: 2
          attn_resolutions: [16]
          dropout: 0.0
        quantconfig:
          target: taming.modules.vqvae.quantize.ASVQ
          params:
            n_e: 16384
            e_dim: 32
            beta: 0.33
            fixed_cb: false
            use_ema_scale: true
        lossconfig:
          target: taming.modules.losses.DummyLoss

data:
  class_path: main.DataModuleFromConfig
  init_args:
    batch_size: 64
    num_workers: 8
    train:
      target: taming.data.faceshq.FFHQTrain
      params:
        size: 256
    validation:
      target: taming.data.faceshq.FFHQValidation
      params:
        size: 256
    test:
      target: taming.data.faceshq.FFHQValidation
      params:
        size: 256

ckpt_path: null
